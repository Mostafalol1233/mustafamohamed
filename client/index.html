<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; connect-src 'self' https: wss: blob:; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:;">
    <title>Mustafa Mohamed - Full-Stack Developer & Content Strategist</title>
    <meta name="description" content="Professional portfolio of Mustafa Mohamed, a Full-Stack Web Developer and Content Strategist specializing in high-performance websites and content that converts." />
    <meta name="keywords" content="full-stack developer, web developer, content strategist, React, Node.js, SEO, digital marketing" />
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="Mustafa Mohamed - Full-Stack Developer & Content Strategist" />
    <meta property="og:description" content="I build high-performance websites and craft content that converts. Specializing in responsive web applications and content strategy." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mustafa-portfolio.com" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Block Replit scripts and console messages -->
    <script>
      // Block Replit console messages
      const originalConsoleLog = console.log;
      const originalConsoleWarn = console.warn;
      const originalConsoleError = console.error;
      
      console.log = function(...args) {
        const message = args.join(' ');
        if (message.includes('replit') || message.includes('Replit') || 
            message.includes('LaunchDarkly') || message.includes('stallwart') ||
            message.includes('join.replit.com')) {
          return;
        }
        originalConsoleLog.apply(console, args);
      };
      
      console.warn = function(...args) {
        const message = args.join(' ');
        if (message.includes('replit') || message.includes('Replit') ||
            message.includes('Content-Security-Policy') || message.includes('Unrecognized feature')) {
          return;
        }
        originalConsoleWarn.apply(console, args);
      };
      
      console.error = function(...args) {
        const message = args.join(' ');
        if (message.includes('replit') || message.includes('Replit') ||
            message.includes('Content-Security-Policy')) {
          return;
        }
        originalConsoleError.apply(console, args);
      };
      
      // Block beforeinstallprompt events
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        return false;
      });
      
      // Remove Replit elements when DOM loads
      document.addEventListener('DOMContentLoaded', function() {
        // Remove any elements containing replit
        const replitElements = document.querySelectorAll('[src*="replit"], [href*="replit"], [class*="replit"], [id*="replit"]');
        replitElements.forEach(el => el.remove());
        
        // Remove specific replit scripts
        const scripts = document.querySelectorAll('script[src*="cdn.replit.com"], script[src*="replit.com"]');
        scripts.forEach(script => script.remove());
      });
      
      // Override fetch to block replit requests
      const originalFetch = window.fetch;
      window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && (url.includes('replit.com') || url.includes('cdn.replit'))) {
          return Promise.reject(new Error('Blocked'));
        }
        return originalFetch.apply(this, args);
      };
    </script>
  </body>
</html>
